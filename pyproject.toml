[project]
name = "fathom-play"
version = "0.2.0"
description = "Fathom.ai API exploration and tooling"
authors = [{name = "ldawson"}]
readme = "readme.md"
requires-python = ">=3.13"

dependencies = [
    "httpx",
    "langchain",
    "langchain-anthropic",
    "langchain-aws",
    "langchain-ollama",
    "langgraph",
    "python-dotenv",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]

[project.scripts]
fathom = "fathom_play.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_play"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fathom_play"]

[tool.black]
target-version = ["py313"]
line-length = 120

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
